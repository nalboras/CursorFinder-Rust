[package]
name = "cursor-finder"
version = "2.0.6"
edition = "2021"
description = "Shake to find cursor for Windows (Rust rewrite of the Qt/C++ CursorFinder)"
license = "GPL-3.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "CursorFinder"
path = "src/main.rs"
